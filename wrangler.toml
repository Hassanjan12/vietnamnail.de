# Cloudflare Worker – Vietnam Nails
# Der Name muss mit dem Projektnamen im Cloudflare-Dashboard übereinstimmen.
name = "vietnamnail-de"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Website aus „public/“; nur /api/* geht durch den Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# D1-Datenbank für Termine, Statistik und Admin-Zugang (im Dashboard mit Standort EU anlegen, ID hier eintragen)
[[d1_databases]]
binding = "DB"
database_name = "vietnam-nails"
database_id = "00000000-0000-0000-0000-000000000000"

[observability]
enabled = true
