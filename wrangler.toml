# Cloudflare Worker – Vietnam Nails
# Der Name muss mit dem Projektnamen im Cloudflare-Dashboard übereinstimmen.
name = "vietnamnail-de2"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Website aus „public/“; nur /api/* geht durch den Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# D1-Datenbank für Termine, Statistik und Admin-Zugang.
# Datenbank mit Jurisdiction EU (Daten bleiben in der EU).
[[d1_databases]]
binding = "DB"
database_name = "vietnam-nails-eu"
database_id = "211b4f0e-27c2-43e2-8cb5-acc4268f3936"

[observability]
enabled = true
