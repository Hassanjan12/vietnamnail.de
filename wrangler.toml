# Cloudflare Worker – Vietnam Nails
# Der Name muss mit dem Projektnamen im Cloudflare-Dashboard übereinstimmen.
name = "vietnamnail-de"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Website aus „public/“; nur /api/* geht durch den Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# D1-Datenbank für Termine, Statistik und Admin-Zugang.
# Schritt 2: im Dashboard anlegen (Standort EU), ID eintragen und die drei Zeilen unten aktivieren.
# Solange keine Datenbank verbunden ist, läuft die Website; Buchungen gehen dann per WhatsApp.
# [[d1_databases]]
# binding = "DB"
# database_name = "vietnam-nails"
# database_id = "HIER-ID-EINTRAGEN"

[observability]
enabled = true
