# Cloudflare Pages – Vietnam Nails
name = "vietnam-nails"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# D1-Datenbank für Termine, Statistik und Admin-Zugang.
# Im Cloudflare-Dashboard anlegen (Standort: EU) und die ID hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "vietnam-nails"
database_id = "HIER-D1-DATENBANK-ID-EINTRAGEN"
